name: Generate and Deploy Javadoc

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Generate Javadoc
        run: |
          cd code
          mvn -B javadoc:javadoc

      - name: Verify Javadoc generation
        run: |
          if [ ! -d "code/target/reports/apidocs" ]; then
            echo "Error: Javadoc directory not found!"
            ls -la code/target/ || true
            exit 1
          fi
          echo "Javadoc generated successfully"
          ls -la code/target/reports/apidocs/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: code/target/reports/apidocs

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4